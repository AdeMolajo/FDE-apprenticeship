<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}DD extraction{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<header class="bar">
  <a class="wordmark" href="{{ url_for('home') }}" style="text-decoration: none; color: inherit">DD&nbsp;EXTRACTION</a>
  <span class="divider"></span>
  <span class="small">Local tool · no sign-in</span>
  <span class="grow"></span>
  {% block nav %}<a href="{{ url_for('new_run') }}" class="btn primary">New run</a>{% endblock %}
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
